services:
  app:
    container_name: monsalve_formatacoes_app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://admin:admin123@db:5432/simpleformat_db?schema=public
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: monsalve_formatacoes_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: monsalve_formatacoes
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: